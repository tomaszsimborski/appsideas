<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Warsztat utworów</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- Mini-odtwarzacz nad paskiem zakładek -->
  <div id="mini" class="mini" hidden>
    <div class="mini-progress"><span id="miniBar"></span></div>
    <button type="button" id="miniOpen" class="mini-open" aria-label="Otwórz odtwarzacz">
      <span class="mini-art"><svg><use href="#i-wave"/></svg></span>
      <span class="mini-text">
        <span id="miniTitle" class="mini-title"></span>
        <span id="miniSub" class="mini-sub"></span>
      </span>
    </button>
    <button type="button" id="miniPlay" class="icon-btn" aria-label="Odtwarzaj">
      <svg><use href="#i-play"/></svg>
    </button>
    <button type="button" id="miniClose" class="icon-btn subtle" aria-label="Zamknij odtwarzacz">
      <svg><use href="#i-x"/></svg>
    </button>
  </div>

  <!-- Dolny pasek: utwory, nagrywanie, foldery -->
  <nav class="tabbar" aria-label="Nawigacja">
    <a href="#/utwory" class="tab" data-tab="utwory">
      <svg><use href="#i-list"/></svg><span>Utwory</span>
    </a>
    <button type="button" id="recTab" class="tab rec" aria-label="Nagraj">
      <span class="rec-dot"><svg><use href="#i-mic"/></svg></span>
    </button>
    <a href="#/foldery" class="tab" data-tab="foldery">
      <svg><use href="#i-folder"/></svg><span>Foldery</span>
    </a>
  </nav>

  <!-- Pełny odtwarzacz z warstwami tekstowymi -->
  <section id="player" class="player" aria-hidden="true" aria-label="Odtwarzacz">
    <header class="player-top">
      <button type="button" id="playerDown" class="icon-btn subtle" aria-label="Zwiń odtwarzacz">
        <svg><use href="#i-chevron-down"/></svg>
      </button>
      <div class="player-folder" id="playerFolder"></div>
      <button type="button" id="playerMore" class="icon-btn subtle" aria-label="Edytuj nagranie">
        <svg><use href="#i-more"/></svg>
      </button>
    </header>

    <div class="player-head">
      <div class="player-song" id="playerSong"></div>
      <div class="player-item" id="playerItem"></div>
    </div>

    <div class="player-media" id="playerMedia">
      <video id="media" playsinline preload="metadata"></video>
      <div id="spotifyBox" class="spotify-box" hidden></div>
      <div class="wave-wrap" id="waveWrap">
        <canvas id="wave" class="wave" aria-label="Przewijanie nagrania"></canvas>
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="transport" id="transport">
        <button type="button" id="speedBtn" class="pill-btn" aria-label="Prędkość odtwarzania">1×</button>
        <button type="button" id="back10" class="icon-btn" aria-label="Cofnij 10 sekund">
          <svg><use href="#i-back10"/></svg>
        </button>
        <button type="button" id="bigPlay" class="play-btn" aria-label="Odtwarzaj">
          <svg><use href="#i-play"/></svg>
        </button>
        <button type="button" id="fwd10" class="icon-btn" aria-label="Do przodu 10 sekund">
          <svg><use href="#i-fwd10"/></svg>
        </button>
        <button type="button" id="loopBtn" class="pill-btn" aria-pressed="false" aria-label="Zapętl">
          <svg><use href="#i-repeat"/></svg>
        </button>
      </div>
    </div>

    <div class="player-layers" id="playerLayers"></div>
  </section>

  <!-- Arkusze (bottom sheets) i komunikaty -->
  <div id="scrim" class="scrim" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="fileInput" accept="audio/*,video/*" multiple hidden>
  <input type="file" id="backupInput" accept="application/json,.json" hidden>

  <!-- Ikony -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h7"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-guitar" viewBox="0 0 24 24"><path d="m14 10 6.5-6.5M18 3l3 3"/><path d="M11.3 8.6c-1.7-.6-3.6-.3-4.8.9-.8.8-1 1.8-.9 2.7-1.4.1-2.6.8-3.1 2-.9 2 .4 4.6 2.6 5.6 2.2.9 4.5.2 5.4-1.6.5-1.1.4-2.3-.2-3.4.9 0 1.8-.3 2.5-1 1.2-1.2 1.5-3 .9-4.7"/><circle cx="9.5" cy="14.5" r="1.4"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 16v4M16.5 18h4"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h1.5M7 8v8M10.5 5v14M14 9v6M17.5 6.5v11M21 11v2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-x"viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
      <symbol id="i-spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 9.5c3-1 6.5-.7 9.3.8M8 12.7c2.5-.7 5.2-.4 7.4.8M8.6 15.7c1.9-.5 3.9-.3 5.6.6"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5l1-12.5"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19l-3-3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5l3 3"/></symbol>
      <symbol id="i-back10" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/><text x="12.3" y="15.6" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text></symbol>
      <symbol id="i-fwd10" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/><text x="11.7" y="15.6" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter, sans-serif">10</text></symbol>
      <symbol id="i-metronome" viewBox="0 0 24 24"><path d="M9.2 3.5h5.6l4 16a1 1 0 0 1-1 1.2H6.2a1 1 0 0 1-1-1.2z"/><path d="M6.5 15.5h11M12 15.5 17 6"/></symbol>
      <symbol id="i-tap" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4.5 15.5a1.5 1.5 0 0 1 2.3-2L9 15"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 11h14M5 16h9"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 15v3.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    </defs>
  </svg>

  <script src="lib.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
