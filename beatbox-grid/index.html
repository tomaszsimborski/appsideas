<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beatbox to Drum Grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Beatbox <span>→</span> Drum Grid</h1>
    <p class="hint">Record yourself beatboxing: <b>“boom”</b> = kick, <b>“ka / pam”</b> = snare, <b>“ts”</b> = hi-hat.</p>
  </header>

  <main>
    <section class="panel">
      <div class="row">
        <button id="recordBtn" class="btn record"><span class="dot"></span><span class="label">Record</span></button>
        <button id="playRecBtn" class="btn" disabled>▶ Play recording</button>
        <label class="btn file">Load audio file…<input id="fileInput" type="file" accept="audio/*" hidden></label>
        <div class="meter" title="Input level"><div id="meterFill"></div></div>
        <span id="recTime" class="mono">0:00.0</span>
      </div>
      <canvas id="wave" height="110"></canvas>
      <div class="row small">
        <label for="sensitivity">Hit sensitivity</label>
        <input id="sensitivity" type="range" min="1" max="10" step="1" value="6">
        <span id="sensitivityVal" class="mono">6</span>
        <span id="status" class="status">Press Record and allow microphone access.</span>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <button id="playPatBtn" class="btn primary" disabled>▶ Play pattern</button>
        <label class="field">BPM
          <input id="bpm" type="number" min="40" max="300" step="1" value="100">
        </label>
        <button id="halfBtn" class="btn small-btn" title="Halve tempo">÷2</button>
        <button id="doubleBtn" class="btn small-btn" title="Double tempo">×2</button>
        <button id="autoBpmBtn" class="btn small-btn" title="Use the detected tempo">Auto</button>
        <span class="sep"></span>
        <span class="small">Shift</span>
        <button id="shiftLeft" class="btn small-btn" title="Move all hits one step earlier">◀</button>
        <button id="shiftRight" class="btn small-btn" title="Move all hits one step later">▶</button>
        <button id="resetBtn" class="btn small-btn" title="Undo your edits and re-use the detected labels">Reset edits</button>
        <label class="small check"><input id="withRec" type="checkbox"> play recording along</label>
      </div>
      <div id="gridWrap" class="grid-wrap">
        <div id="grid" class="grid"></div>
      </div>
      <p id="summary" class="small muted">Tap any cell to add or remove a hit. To fix a wrong label, tap the wrong cell off and the right one on in the same column.</p>
    </section>
  </main>

  <script src="analysis.js"></script>
  <script src="app.js"></script>
</body>
</html>
